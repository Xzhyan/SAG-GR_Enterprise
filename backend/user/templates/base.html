{% load django_browser_reload %}
{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <!-- Tailwindcss -->
     <link rel="stylesheet" href="{% static 'output.css' %}">
</head>
<body class="min-h-screen flex flex-col bg-zinc-950 text-gray-300">
    <!-- Cabeçalho -->
    <header class="flex flex-col">
        <!-- Barra do titulo -->
        <div class="flex items-center justify-between bg-zinc-950 {% if request.user.is_authenticated %} border-t {% else %} border {% endif %} border-zinc-800 p-2">
            <h1 class="font-semibold">SAG-GR Enterprise</h1>
            <p class="text-gray-400">ver. 2.0.0</p>
        </div>
        
        {% if request.user.is_authenticated %}
            <!-- Barra de navegação -->
            <nav class="grid grid-cols-1 md:grid-cols-6 border border-zinc-800 text-center font-semibold text-white">
                <div class="md:col-span-4 flex items-center justify-start p-2">
                    <ul class="flex gap-2">
                        <a href="#"
                            class="bg-zinc-950 border border-zinc-500 hover:bg-gray-900 transition rounded-md shadow-md px-4 py-2"
                        >
                            Home
                        </a>

                        <a href="#"
                            class="bg-zinc-950 border border-zinc-500 hover:bg-gray-900 transition rounded-md shadow-md px-4 py-2"
                        >
                            Departamento
                        </a>
                    </ul>
                </div>
                
                <div class="md:col-span-2 flex items-center justify-end p-2">
                    <ul class="flex gap-2">
                        <a href="#"
                            class="bg-red-800 border border-zinc-500 hover:bg-red-700 transition rounded-md shadow-md px-4 py-2"
                        >
                            Sair
                        </a>

                        <a href="#"
                            class="bg-green-800 border border-zinc-500 hover:bg-green-700 transition rounded-md shadow-md px-4 py-2"
                        >
                            Usuário
                        </a>
                    </ul>
                </div>
            </nav>
        {% endif %}
    </header>

    <!-- Conteúdo -->
    <main class="flex-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="mt-auto bg-zinc-950 text-sm border border-zinc-800 text-center p-2">
        <p>Copyright &copy; 2026 - Zyandev</p>
    </footer>
</body>
</html>
