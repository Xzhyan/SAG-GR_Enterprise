<div class="md:col-span-10 grid grid-cols-1 md:grid-cols-5">
    <!-- Lista dos usuários -->
    <div class="md:col-span-3 bg-zinc-900 border border-zinc-600 p-2 rounded-md shadow-md">
        <div class="flex items-center justify-between">
            <h2 class="font-semibold p-2">Lista de membros</h2>
        </div>

        <table class="w-full text-center">
            <colgroup>
                <col class="w-[25%]">
                <col class="w-[25%]">
                <col class="w-[10%]">
                <col class="w-[10%]">
                <col class="w-[30%]">
            </colgroup>

            <thead class="bg-zinc-950 text-xs">
                <tr>
                    <th class="p-1 font-semibold">Username</th>
                    <th class="p-1 font-semibold">Grupo(s)</th>
                    <th class="p-1 font-semibold">Staff</th>
                    <th class="p-1 font-semibold">Superuser</th>
                    <th class="p-1 font-semibold">Ações</th>
                </tr>
            </thead>
            <tbody class="bg-zinc-700 shadow-md">
                {% for user in users %}
                    <tr class="hover:bg-zinc-600 cursor-pointer">
                        <td class="p-2">{{ user.username }}</td>
                        <td class="p-2">
                            {% for group in user.groups.all %}
                                {{ group.name }}
                            {% empty %}
                                sem grupo...
                            {% endfor %}
                        </td>
                        <td class="p-2">{{ user.is_staff }}</td>
                        <td class="p-2">{{ user.is_superuser }}</td>
                        <td>
                            <div class="flex flex-col md:flex-row gap-2 p-1">
                                <a href=""
                                    class="w-[100px] bg-green-800 border border-green-950 cursor-pointer hover:bg-green-700 transition rounded-md shadow-md p-2 font-semibold"
                                >
                                    Editar
                                </a>

                                <a href=""
                                    class="w-[100px] bg-red-800 border border-red-950 cursor-pointer hover:bg-red-700 transition rounded-md shadow-md p-2 font-semibold"
                                >
                                    Deletar
                                </a>
                            </div>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
