<div class="md:col-span-10 bg-zinc-900 border border-zinc-600 p-2 rounded-md shadow-md">
    <form method="POST"
        class="flex flex-col gap-2"
    >
        {% csrf_token %}

        <div class="grid grid-cols-3 gap-2">
            {% for field in form %}
                <div class="flex flex-col">
                    <!-- Label e campo -->
                    {{ field.label_tag }}
                    {{ field }}

                    <!-- Erros do campo -->
                    {% for error in field.errors %}
                        <div class="p-2 text-sm text-red-500 border border-red-500 rounded-md shadow-md">
                            <p>{{ error }}</p>
                        </div>
                    {% endfor %}

                    <!-- Ajuda do campo -->
                    <!-- {% if field.help_text %}
                        <div class="p-2 text-sm text-blue-500 border border-red-500 rounded-md shadow-md">
                            <p>{{ field.help_text }}</p>
                        </div>
                    {% endif %} -->
                </div>
            {% endfor %}
        </div>

        <button type="submit"
            class="w-[100px] mx-auto bg-blue-900 border border-blue-950 cursor-pointer hover:bg-blue-800 transition rounded-md shadow-md px-4 font-semibold py-2"
        >
            Salvar
        </button>
    </form>
</div>
